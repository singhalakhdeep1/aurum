services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      # Point the app at the bundled database, overriding whatever .env says
      DATABASE_URL: postgresql://aurum:aurum_pass@postgres:5432/aurum_db?schema=public
      DIRECT_URL: postgresql://aurum:aurum_pass@postgres:5432/aurum_db?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aurum
      POSTGRES_PASSWORD: aurum_pass
      POSTGRES_DB: aurum_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurum -d aurum_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
